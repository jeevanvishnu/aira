<svg width="80" height="120" viewBox="0 0 80 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Central Diamond -->
  <path d="M40 0 L80 60 L40 120 L0 60 Z" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="40" y1="120" x2="40" y2="0" stroke="currentColor" stroke-width="0.4" stroke-opacity="0.15"/>
  <!-- Central Diamond Fans -->
  <line x1="40" y1="120" x2="20" y2="30" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="40" y1="120" x2="60" y2="30" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.12"/>
  
  <!-- Offset Corners (Bottom Left Fan) -->
  <path d="M0 60 L40 120 L0 180" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="0" y1="120" x2="0" y2="60" stroke="currentColor" stroke-width="0.4" stroke-opacity="0.15"/>
  <line x1="0" y1="120" x2="20" y2="90" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.12"/>

  <!-- Offset Corners (Bottom Right Fan) -->
  <path d="M80 60 L40 120 L80 180" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="80" y1="120" x2="80" y2="60" stroke="currentColor" stroke-width="0.4" stroke-opacity="0.15"/>
  <line x1="80" y1="120" x2="60" y2="90" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.12"/>
  
  <!-- Offset Corners (Top Left Fan) -->
  <line x1="0" y1="60" x2="0" y2="0" stroke="currentColor" stroke-width="0.4" stroke-opacity="0.15"/>
  <line x1="0" y1="60" x2="20" y2="30" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.12"/>
  
  <!-- Offset Corners (Top Right Fan) -->
  <line x1="80" y1="60" x2="80" y2="0" stroke="currentColor" stroke-width="0.4" stroke-opacity="0.15"/>
  <line x1="80" y1="60" x2="60" y2="30" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.12"/>
</svg>
